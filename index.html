<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>walrusroom : art deco</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050201; }
  canvas { display: block; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: #050201;
    color: #ffd9ec; text-align: center; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: opacity .45s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay .intro {
    font-size: clamp(1.15rem, 2.4vw, 1.6rem);
    font-weight: 500;
    letter-spacing: .02em;
    opacity: .95;
  }

  #overlay .hint {
    font-size: .82rem;
    opacity: .6;
    letter-spacing: .12em;
    text-transform: uppercase;
    max-width: 36rem;
    line-height: 2.1;
  }

  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    z-index: 5;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    background: #ff6fb5;
    clip-path: polygon(
      50% 0%, 61% 35%, 98% 35%, 68% 57%,
      79% 91%, 50% 70%, 21% 91%, 32% 57%,
      2% 35%, 39% 35%
    );
    filter: drop-shadow(0 0 5px rgba(255,111,181,0.95))
            drop-shadow(0 0 12px rgba(255,111,181,0.5));
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
  }
  #crosshair.on {
    opacity: 1;
    animation: crosshair-pulse 2.4s ease-in-out infinite;
  }
  @keyframes crosshair-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }
  @media (prefers-reduced-motion: reduce) {
    #crosshair.on { animation: none; }
  }
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="overlay">
  <p class="intro">Click anywhere to enter</p>
  <p class="hint">
    WASD move &middot; Shift run &middot; Mouse look &middot;
    M music &middot; T fast-forward time &middot; Esc release
  </p>
</div>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

   ========================================================= */

const ART_DIR   = '_resized/';
const ART_EXT   = 'jpg';

  '025.jpg', '026.jpg', '027.jpg', '028.jpg', '029.jpg', '030.jpg',
  '031.jpg', '032.jpg', '033.jpg', '034.jpg', '035.jpg', '036.jpg',
  '037.jpg', '038.jpg', '039.jpg', '040.jpg', '041.jpg', '042.jpg',
  '043.jpg', '044.jpg', '045.jpg', '046.jpg', '047.jpg', '048.jpg',

/* =========================================================
   RENDERER / SCENE / CAMERA
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1); // 90s pixel look
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// Deep purple fog
scene.fog = new THREE.FogExp2(0x14002e, 0.008);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';

/* =========================================================
   PROCEDURAL TEXTURES
   ========================================================= */
function makeTex(w, h, drawFn, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  drawFn(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(repeatX, repeatY);
  return tex;
}

// 1. Dark Marble Floor
const floorTex = makeTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#0a0604';
  ctx.fillRect(0, 0, w, h);
  ctx.strokeStyle = '#1f120a';
  ctx.lineWidth = 2;
  for (let i = 0; i <= w; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
  }
}, 10, 70);

// 2. Grand Red Carpet
const carpetTex = makeTex(64, 64, (ctx, w, h) => {
  ctx.fillStyle = '#4a0b0b';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#d4af37';
  ctx.fillRect(0, 0, 4, h);
  ctx.fillRect(w - 4, 0, 4, h);
  ctx.strokeStyle = '#2e0505';
  ctx.lineWidth = 2;
  for (let i = 0; i < w; i += 16) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 16, h); ctx.stroke();
  }
}, 1, 70);

// 3. Wall Wainscoting
const wainscotTex = makeTex(64, 64, (ctx, w, h) => {
  ctx.fillStyle = '#1a0d07';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#2e170c';
  for (let i = 0; i < w; i += 16) {
    ctx.fillRect(i, 0, 12, h);
  }
}, 30, 1);

// 4. City Backdrop
const cityTex = makeTex(512, 256, (ctx, w, h) => {
  ctx.fillStyle = '#000000';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < w; i += 24) {
    const bHeight = 60 + Math.random() * 180;
    ctx.fillStyle = '#08050a';
    ctx.fillRect(i, h - bHeight, 20, bHeight);
    ctx.fillStyle = '#ffddaa';
    for (let j = h - bHeight + 10; j < h; j += 12) {
      if (Math.random() > 0.7) ctx.fillRect(i + 4, j, 3, 4);
      if (Math.random() > 0.7) ctx.fillRect(i + 12, j, 3, 4);
    }
  }
}, 12, 1);

// 5. Ceiling
const ceilTex = makeTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#0f0804';
  ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#2e170c';
  for (let x = 0; x < w; x += 64) {
    for (let y = 0; y < h; y += 64) {
      ctx.fillRect(x, y, 8, 64);
      ctx.fillRect(x, y, 64, 8);
    }
  }
}, 5, 35);

/* =========================================================

// Floor & Carpet

redIris.rotation.x = Math.PI / 2;
redIris.position.z = Math.sqrt(36 - (3.5 * 3.5));

// 3. The Yellow Iris Inner Ring

const yellowIrisMat = new THREE.MeshLambertMaterial({ color: 0xffcc00, emissive: 0x553300 });
const yellowIris = new THREE.Mesh(yellowIrisGeo, yellowIrisMat);
yellowIris.rotation.x = Math.PI / 2;
yellowIris.position.z = Math.sqrt(36 - (2.2 * 2.2));
eyeGroup.add(yellowIris);

// 4. The Pupil
const pupilGeo = new THREE.CylinderGeometry(1, 1, 1.2, 32);
const pupilMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
const pupil = new THREE.Mesh(pupilGeo, pupilMat);
pupil.rotation.x = Math.PI / 2;
pupil.position.z = Math.sqrt(36 - 1);

// 5. The Art Deco Gold Eyelid/Socket
const eyelidGeo = new THREE.TorusGeometry(5.5, 0.6, 16, 64);
const eyelid = new THREE.Mesh(eyelidGeo, goldMat);
eyelid.position.z = 2; 
eyeGroup.add(eyelid);

scene.add(eyeGroup);

// City Backdrops
const cityMat = new THREE.MeshBasicMaterial({ map: cityTex, color: 0xffffff, transparent: true });
const cityBackL = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_LENGTH, 30), cityMat);
cityBackL.rotation.y = Math.PI / 2;
cityBackL.position.set(-ROOM_WIDTH / 2 - 8, 10, 0);
scene.add(cityBackL);

const cityBackR = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_LENGTH, 30), cityMat);
cityBackR.rotation.y = -Math.PI / 2;
cityBackR.position.set(ROOM_WIDTH / 2 + 8, 10, 0);

// Wall Structures
const wallMat = new THREE.MeshLambertMaterial({ map: wainscotTex });
const goldMat = new THREE.MeshLambertMaterial({ color: 0xc7a252 });
const glassMat = new THREE.MeshBasicMaterial({ color: 0x00331a, transparent: true, opacity: 0.65, side: THREE.DoubleSide });

const MODULE_WIDTH = 8;
const NUM_MODULES = Math.floor(ROOM_LENGTH / MODULE_WIDTH);

for (let i = 0; i < NUM_MODULES; i++) {
  const zPos = -ROOM_LENGTH / 2 + (i * MODULE_WIDTH) + (MODULE_WIDTH / 2);

function createWallModule(x, z, rotation) {

  const top = new THREE.Mesh(frameTB, goldMat); top.position.set(0, 16, -0.3); group.add(top);
  const bot = new THREE.Mesh(frameTB, goldMat); bot.position.set(0, 6, -0.3); group.add(bot);
  const frameS = new THREE.BoxGeometry(0.4, 10, 0.4);
  const left = new THREE.Mesh(frameS, goldMat); left.position.set(-2.5, 11, -0.3); group.add(left);
  const right = new THREE.Mesh(frameS, goldMat); right.position.set(2.5, 11, -0.3); group.add(right);
  const center = new THREE.Mesh(new THREE.BoxGeometry(0.2, 10, 0.4), goldMat); center.position.set(0, 11, -0.3); group.add(center);

  // Pillar

/* =========================================================
   90s DECORATIONS (Plants, Lamps, Vases)
   ========================================================= */
const decorMatDark = new THREE.MeshLambertMaterial({ color: 0x0f0f0f });
const decorMatGreen = new THREE.MeshLambertMaterial({ color: 0x1e3b1e });
const decorMatLeaf = new THREE.MeshLambertMaterial({ color: 0x2b5c2b });
const decorMatTerracotta = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
const lampShadeMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
const ceilingLights = []; 

function createPlant() {
  const group = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.8, 1.8, 6), decorMatTerracotta);
  pot.position.y = 0.9;
  group.add(pot);
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.2, 6), decorMatDark);
  dirt.position.y = 1.8;
  group.add(dirt);

  trunk.position.y = 3;

    leaf.position.x = (Math.random() - 0.5) * 1.5;

function createLamp() {

function createVase() {

}

// Spread down the hallway. 7.0 spacing leaves a perfect gap.
const Z_START = (ROOM_LENGTH / 2) - 20; // Automatically adjusts to the room length
const Z_SPACING = 7.0;

// Automatically place decorations in the gaps between easels
for (let i = 0; i < ART_COUNT; i++) {
  const isLeft = i % 2 === 0;
  const rowIndex = Math.floor(i / 2);
  
  const decorZ = Z_START - (rowIndex * Z_SPACING) - (Z_SPACING / 2);
  const x = isLeft ? -ROOM_WIDTH / 2 + 2.0 : ROOM_WIDTH / 2 - 2.0;

  if (i % 3 === 0) {
    const lamp = createLamp(); lamp.position.set(x, 0, decorZ); scene.add(lamp);
  } else if (i % 3 === 1) {
    const plant = createPlant(); plant.position.set(x, 0, decorZ); scene.add(plant);
  } else {
    const vase = createVase(); vase.position.set(x, 0, decorZ); scene.add(vase);
  }
}

/* =========================================================
   BLACK SLIM EASELS + ARTWORK
   ========================================================= */
const easelMat = new THREE.MeshLambertMaterial({ color: 0x050505 });
const unitPaintingGeo = new THREE.PlaneGeometry(1, 1);
const MAX_PAINT_W = 4.0;
const MAX_PAINT_H = 5.0;

const paintings = [];
const imgLoader = new THREE.ImageLoader();
imgLoader.setCrossOrigin('anonymous');
let activeLoads = 0;

function imageToTexture(img) {
  const scale = Math.min(1, 512 / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale));
  const h = Math.max(1, Math.round(img.height * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  return tex;
}

function fitPainting(mesh, imgW, imgH) {
  const aspect = imgW / imgH;
  const boxAspect = MAX_PAINT_W / MAX_PAINT_H;
  let w, h;
  if (aspect > boxAspect) {
    w = MAX_PAINT_W;
    h = MAX_PAINT_W / aspect;
  } else {
    h = MAX_PAINT_H;
    w = MAX_PAINT_H * aspect;
  }
  mesh.scale.set(w, h, 1);
  mesh.position.y = 2.0 + h / 2;
}

function createEasel() {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat);
  pole.position.y = 3.5;
  group.add(pole);
  
  const backLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat);
  backLeg.position.set(0, 3.5, -1.0);
  backLeg.rotation.x = 0.3;
  group.add(backLeg);

  const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat);
  leftLeg.position.set(-1.0, 3.5, 0.5);
  leftLeg.rotation.z = 0.25;
  leftLeg.rotation.x = -0.1;
  group.add(leftLeg);

  const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat);
  rightLeg.position.set(1.0, 3.5, 0.5);
  rightLeg.rotation.z = -0.25;
  rightLeg.rotation.x = -0.1;
  group.add(rightLeg);

  const shelf = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.2, 1.4), easelMat);
  shelf.position.set(0, 2.0, 0.6);
  group.add(shelf);

  return group;
}

for (let i = 0; i < ART_COUNT; i++) {
  const isLeft = i % 2 === 0;
  const rowIndex = Math.floor(i / 2);
  
  const xPos = isLeft ? -ROOM_WIDTH / 2 + 3.5 : ROOM_WIDTH / 2 - 3.5;
  const zPos = Z_START - (rowIndex * Z_SPACING);

  const easel = createEasel();
  easel.position.set(xPos, 0, zPos);
  easel.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
  scene.add(easel);

  const mat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const mesh = new THREE.Mesh(unitPaintingGeo, mat);
  mesh.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
  
  const forwardOffset = isLeft ? 0.7 : -0.7;
  mesh.position.set(xPos + forwardOffset, 2.0, zPos);

  scene.add(mesh);
  paintings.push({ mesh, mat, url: ART_DIR + ART_FILES[i], state: 'pending' });
}

/* ----- Lazy loading ----- */
const MAX_CONCURRENT = 3;
function beginLoad(p) {
  p.state = 'loading';
  activeLoads++;
  imgLoader.load(
    p.url,
    (img) => {
      const tex = imageToTexture(img);
      p.mat.map = tex;
      p.mat.emissiveMap = tex;
      p.mat.emissive = new THREE.Color(0xffffff);
      p.mat.color.setRGB(1, 1, 1);
      p.mat.needsUpdate = true;
      fitPainting(p.mesh, img.width, img.height);
      p.state = 'ready';
      activeLoads--;
    },
    undefined,
    () => {
      p.state = 'failed';
      activeLoads--;
      console.warn('Could not load artwork:', p.url);
    }
  );
}

let scanTimer = 0;
function scanForLoads(dt) {
  scanTimer -= dt;
  if (scanTimer > 0) return;
  scanTimer = 0.3;
  if (activeLoads >= MAX_CONCURRENT) return;

  const candidates = [];
  for (const p of paintings) {
    if (p.state !== 'pending') continue;
    const d = p.mesh.position.distanceTo(camera.position);
    if (d < 45) candidates.push({ p, d });
  }
  if (!candidates.length) return;

  candidates.sort((a, b) => a.d - b.d);
  for (const c of candidates) {
    if (activeLoads >= MAX_CONCURRENT) break;
    beginLoad(c.p);
  }
}

/* =========================================================
   FIRST-PERSON CONTROLS
   ========================================================= */
const overlay = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');
const controls = new PointerLockControls(camera, renderer.domElement);

overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => {
  overlay.classList.add('hidden');
  crosshair.classList.add('on');
  startMusic();
});
controls.addEventListener('unlock', () => {
  overlay.classList.remove('hidden');
  crosshair.classList.remove('on');
});

const keys = Object.create(null);
addEventListener('keydown', (e) => {
  keys[e.code] = true;
  if (e.repeat) return;
  if (e.code === 'KeyM') toggleMusic();
  if (e.code === 'KeyT') timeScale = timeScale === 1 ? 40 : 1;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });

const EYE_HEIGHT = 3.0;
const WALK_SPEED = 10;
const RUN_SPEED = 20;

const velocity = new THREE.Vector3();
const forward = new THREE.Vector3();
const rightVec = new THREE.Vector3();
const wish = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);

// Spawn at the entrance, relative to the length of the room
camera.position.set(0, EYE_HEIGHT, (ROOM_LENGTH / 2) - 2);
camera.rotation.y = Math.PI;

function updatePlayer(dt) {
  const speed = (keys.ShiftLeft || keys.ShiftRight) ? RUN_SPEED : WALK_SPEED;
  camera.getWorldDirection(forward);
  forward.y = 0;
  if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
  forward.normalize();
  rightVec.crossVectors(forward, UP).normalize();

  wish.set(0, 0, 0);
  if (keys.KeyW || keys.ArrowUp) wish.add(forward);
  if (keys.KeyS || keys.ArrowDown) wish.sub(forward);
  if (keys.KeyD || keys.ArrowRight) wish.add(rightVec);
  if (keys.KeyA || keys.ArrowLeft) wish.sub(rightVec);
  if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(speed);

  velocity.lerp(wish, 1 - Math.exp(-10 * dt));
  camera.position.addScaledVector(velocity, dt);

  const limitX = 8;
  const limitZ = (ROOM_LENGTH / 2) - 2;
  
  camera.position.x = Math.max(-limitX, Math.min(limitX, camera.position.x));
  camera.position.z = Math.max(-limitZ, Math.min(limitZ, camera.position.z));
  camera.position.y = EYE_HEIGHT;
}

/* =========================================================
   TIME OF DAY (20 Minute Cycle)
   ========================================================= */
let worldTime = 0;
let timeScale = 1;

const cDay = new THREE.Color(0xff5c46);
const cPurp = new THREE.Color(0x4b1470);
const cWarm = new THREE.Color(0xffddaa);
const cTmp = new THREE.Color();

function updateTimeAndLighting() {
  const phase = (worldTime / CYCLE_SECONDS) % 1;
  const nightFactor = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);

  cTmp.copy(cDay).lerp(cPurp, nightFactor);
  cityMat.color.copy(cTmp);

  ambient.intensity = THREE.MathUtils.lerp(1.5, 0.3, nightFactor);
  windowLight.intensity = THREE.MathUtils.lerp(1.5, 0.1, nightFactor);
  
  ceilingFixtures.forEach(l => {
    l.material.color.copy(cTmp).lerp(cWarm, 1 - nightFactor * 0.9);
  });

  lampShadeMat.color.copy(cWarm).multiplyScalar(1 - nightFactor * 0.7); 

  scene.fog.color.copy(cTmp);
  
  paintings.forEach(p => {
    if (p.state === 'ready') {
      p.mat.emissiveIntensity = 0.05 + nightFactor * 0.85;
    }
  });
}

/* =========================================================
   MUSIC
   ========================================================= */
let audioCtx = null;
let masterGain = null;
let musicEl = null;
let musicMuted = false;

function startMusic() {
  if (MUSIC_URL) {
    if (musicEl) { musicEl.play().catch(() => {}); return; }
    musicEl = new Audio(MUSIC_URL);
    musicEl.loop = true;
    musicEl.volume = 0.55;
    musicEl.addEventListener('error', () => {
      console.warn('Music failed to load, falling back to ambient:', MUSIC_URL);
      musicEl = null;
      startGeneratedAmbient();
    }, { once: true });
    musicEl.play().catch(() => {});
    return;
  }
  startGeneratedAmbient();
}

function startGeneratedAmbient() {
  if (audioCtx) { if (audioCtx.state === 'suspended') audioCtx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  audioCtx = new AC();

  masterGain = audioCtx.createGain();
  masterGain.gain.value = 0;
  masterGain.connect(audioCtx.destination);
  masterGain.gain.linearRampToValueAtTime(0.16, audioCtx.currentTime + 5);

  const droneSpecs = [
    { f: 55.0,  type: 'sine',     vol: 0.22 },
    { f: 82.4,  type: 'triangle', vol: 0.10 },
    { f: 110.0, type: 'sine',     vol: 0.15 },
    { f: 164.8, type: 'sine',     vol: 0.07 },
  ];
  droneSpecs.forEach((spec) => {
    const osc = audioCtx.createOscillator();
    osc.type = spec.type;
    osc.frequency.value = spec.f;
    osc.detune.value = (Math.random() - 0.5) * 10;
    const g = audioCtx.createGain();
    g.gain.value = spec.vol;
    const lfo = audioCtx.createOscillator();
    lfo.frequency.value = 0.03 + Math.random() * 0.06;
    const lfoGain = audioCtx.createGain();
    lfoGain.gain.value = spec.vol * 0.5;
    lfo.connect(lfoGain).connect(g.gain);
    lfo.start();
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass';
    filt.frequency.value = 420 + Math.random() * 500;
    filt.Q.value = 0.7;
    osc.connect(g).connect(filt).connect(masterGain);
    osc.start();
  });
}

function toggleMusic() {
  if (musicEl) { musicEl.muted = !musicEl.muted; return; }
  if (!audioCtx || !masterGain) return;
  musicMuted = !musicMuted;
  masterGain.gain.setTargetAtTime(musicMuted ? 0 : 0.16, audioCtx.currentTime, 0.35);
}

/* =========================================================
   RESIZE + RENDER LOOP
   ========================================================= */
addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);

  worldTime += dt * timeScale;

  if (controls.isLocked) updatePlayer(dt);
  else velocity.multiplyScalar(1 - Math.min(1, 8 * dt));

  scanForLoads(dt);
  updateTimeAndLighting();
  
  // --- Animate the Giant Eye ---
  const lookSpeed = worldTime * 0.5;
  // The eye looks left and right
  pupil.position.x = Math.sin(lookSpeed) * 1.2;
  yellowIris.position.x = Math.sin(lookSpeed) * 1.2;
  redIris.position.x = Math.sin(lookSpeed) * 0.6;
  
  // The pupil dilates (gets bigger and smaller)
  const dilate = 1 + Math.sin(worldTime * 3) * 0.2;
  pupil.scale.x = dilate;
  pupil.scale.y = dilate;
  
  renderer.render(scene, camera);
}
animate();
</script>
