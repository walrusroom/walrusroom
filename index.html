<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>walrusroom : art deco</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #050201; }
  canvas { display: block; }

  #overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: #050201;
    color: #ffd9ec; text-align: center; cursor: pointer;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    transition: opacity .45s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }

  #overlay .intro {
    font-size: clamp(1.15rem, 2.4vw, 1.6rem);
    font-weight: 500;
    letter-spacing: .02em;
    opacity: .95;
  }

  #overlay .hint {
    font-size: .82rem;
    opacity: .6;
    letter-spacing: .12em;
    text-transform: uppercase;
    max-width: 36rem;
    line-height: 2.1;
  }

  #crosshair {
    position: fixed;
    left: 50%; top: 50%;
    z-index: 5;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    background: #ff6fb5;
    clip-path: polygon(
      50% 0%, 61% 35%, 98% 35%, 68% 57%,
      79% 91%, 50% 70%, 21% 91%, 32% 57%,
      2% 35%, 39% 35%
    );
    filter: drop-shadow(0 0 5px rgba(255,111,181,0.95))
            drop-shadow(0 0 12px rgba(255,111,181,0.5));
    pointer-events: none;
    opacity: 0;
    transition: opacity .3s;
  }
  #crosshair.on {
    opacity: 1;
    animation: crosshair-pulse 2.4s ease-in-out infinite;
  }
  @keyframes crosshair-pulse {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(1.12); }
  }
</style>
</head>
<body>

<div id="crosshair"></div>
<div id="overlay">
  <p class="intro">Click anywhere to enter</p>
  <p class="hint">
    WASD move &middot; Shift run &middot; Mouse look &middot;
    M music &middot; T fast-forward time &middot; Esc release
  </p>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

/* =========================================================
   ⚙️  CONFIG
   ========================================================= */
const MUSIC_URL = 'https://archive.org/download/the-sound-of-damnation/The%20Sound%20of%20Damnation.mp3';
const ART_DIR   = '_resized/';
const ART_COUNT = 64;
const ART_FILES = Array.from({ length: ART_COUNT }, (_, i) => `${String(i + 1).padStart(3, '0')}.jpg`);
const CYCLE_SECONDS = 20 * 60;

/* =========================================================
   RENDERER / SCENE / CAMERA
   ========================================================= */
const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(1);
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x14002e, 0.008);

const camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.1, 300);
camera.rotation.order = 'YXZ';

/* =========================================================
   PROCEDURAL TEXTURES
   ========================================================= */
function makeTex(w, h, drawFn, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); drawFn(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter; tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(repeatX, repeatY);
  return tex;
}

const floorTex = makeTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#0a0604'; ctx.fillRect(0, 0, w, h); ctx.strokeStyle = '#1f120a'; ctx.lineWidth = 2;
  for (let i = 0; i <= w; i += 32) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, h); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(w, i); ctx.stroke();
  }
}, 10, 70);

const carpetTex = makeTex(64, 64, (ctx, w, h) => {
  ctx.fillStyle = '#4a0b0b'; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#d4af37'; ctx.fillRect(0, 0, 4, h); ctx.fillRect(w - 4, 0, 4, h);
  ctx.strokeStyle = '#2e0505'; ctx.lineWidth = 2;
  for (let i = 0; i < w; i += 16) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + 16, h); ctx.stroke(); }
}, 1, 70);

const wainscotTex = makeTex(64, 64, (ctx, w, h) => {
  ctx.fillStyle = '#1a0d07'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#2e170c';
  for (let i = 0; i < w; i += 16) { ctx.fillRect(i, 0, 12, h); }
}, 30, 1);

const cityTex = makeTex(512, 256, (ctx, w, h) => {
  ctx.fillStyle = '#000000'; ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < w; i += 24) {
    const bHeight = 60 + Math.random() * 180;
    ctx.fillStyle = '#08050a'; ctx.fillRect(i, h - bHeight, 20, bHeight);
    ctx.fillStyle = '#ffddaa';
    for (let j = h - bHeight + 10; j < h; j += 12) {
      if (Math.random() > 0.7) ctx.fillRect(i + 4, j, 3, 4);
      if (Math.random() > 0.7) ctx.fillRect(i + 12, j, 3, 4);
    }
  }
}, 12, 1);

const ceilTex = makeTex(128, 128, (ctx, w, h) => {
  ctx.fillStyle = '#0f0804'; ctx.fillRect(0, 0, w, h); ctx.fillStyle = '#2e170c';
  for (let x = 0; x < w; x += 64) {
    for (let y = 0; y < h; y += 64) { ctx.fillRect(x, y, 8, 64); ctx.fillRect(x, y, 64, 8); }
  }
}, 5, 35);

/* =========================================================
   THE HALLWAY & HIDDEN ROOMS
   ========================================================= */
const ROOM_WIDTH = 28; const ROOM_LENGTH = 254; const ROOM_HEIGHT = 18; const ROOM_EXTENSION = 45;
const wallMat = new THREE.MeshLambertMaterial({ map: wainscotTex });
const goldMat = new THREE.MeshLambertMaterial({ color: 0xc7a252 });
const glassMat = new THREE.MeshBasicMaterial({ color: 0x00331a, transparent: true, opacity: 0.65, side: THREE.DoubleSide });
const doorMat = new THREE.MeshLambertMaterial({ color: 0x2e170c });
const neonPinkMat = new THREE.MeshBasicMaterial({ color: 0xff00aa });
const neonGreenMat = new THREE.MeshBasicMaterial({ color: 0x00ff44 });
const darkTunnelMat = new THREE.MeshLambertMaterial({ color: 0x0a0508 });

const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_LENGTH), new THREE.MeshLambertMaterial({ map: floorTex }));
floor.rotation.x = -Math.PI / 2; scene.add(floor);

const carpet = new THREE.Mesh(new THREE.PlaneGeometry(10, ROOM_LENGTH - 10), new THREE.MeshLambertMaterial({ map: carpetTex }));
carpet.rotation.x = -Math.PI / 2; carpet.position.set(0, 0.01, 0); scene.add(carpet);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_LENGTH), new THREE.MeshLambertMaterial({ map: ceilTex }));
ceiling.rotation.x = Math.PI / 2; ceiling.position.y = ROOM_HEIGHT; scene.add(ceiling);

const entRoomZ = ROOM_LENGTH / 2 + ROOM_EXTENSION / 2;
const entFloor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_EXTENSION), new THREE.MeshLambertMaterial({ map: floorTex }));
entFloor.rotation.x = -Math.PI / 2; entFloor.position.set(0, 0, entRoomZ); scene.add(entFloor);
const entCeil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_EXTENSION), new THREE.MeshLambertMaterial({ map: ceilTex }));
entCeil.rotation.x = Math.PI / 2; entCeil.position.set(0, ROOM_HEIGHT, entRoomZ); scene.add(entCeil);
const entBackWall = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_HEIGHT), wallMat);
entBackWall.rotation.y = Math.PI; entBackWall.position.set(0, ROOM_HEIGHT / 2, ROOM_LENGTH / 2 + ROOM_EXTENSION); scene.add(entBackWall);

const fountainGroup = new THREE.Group();
fountainGroup.position.set(0, 0, entRoomZ);
const fBase1 = new THREE.Mesh(new THREE.CylinderGeometry(12, 13, 0.5, 8), wallMat); fBase1.position.y = 0.25; fountainGroup.add(fBase1);
const fBase2 = new THREE.Mesh(new THREE.CylinderGeometry(10, 11, 0.5, 8), wallMat); fBase2.position.y = 0.75; fountainGroup.add(fBase2);
const fTrim1 = new THREE.Mesh(new THREE.CylinderGeometry(12.2, 12.2, 0.1, 8), goldMat); fTrim1.position.y = 0.5; fountainGroup.add(fTrim1);
const fLiquid1 = new THREE.Mesh(new THREE.CylinderGeometry(9.5, 9.5, 0.1, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 })); fLiquid1.position.y = 1.05; fountainGroup.add(fLiquid1);
const fPillar = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 3.5, 6, 8), wallMat); fPillar.position.y = 4; fountainGroup.add(fPillar);
const fRing1 = new THREE.Mesh(new THREE.TorusGeometry(2.8, 0.1, 8, 16), neonPinkMat); fRing1.rotation.x = Math.PI / 2; fRing1.position.y = 2.5; fountainGroup.add(fRing1);
const fRing2 = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.1, 8, 16), neonPinkMat); fRing2.rotation.x = Math.PI / 2; fRing2.position.y = 5.5; fountainGroup.add(fRing2);
const fTier2 = new THREE.Mesh(new THREE.CylinderGeometry(6, 5, 0.5, 8), wallMat); fTier2.position.y = 7; fountainGroup.add(fTier2);
const fTrim2 = new THREE.Mesh(new THREE.CylinderGeometry(6.2, 6.2, 0.1, 8), goldMat); fTrim2.position.y = 7.25; fountainGroup.add(fTrim2);
const fLiquid2 = new THREE.Mesh(new THREE.CylinderGeometry(5.7, 5.7, 0.1, 8), new THREE.MeshBasicMaterial({ color: 0xff0000 })); fLiquid2.position.y = 7.3; fountainGroup.add(fLiquid2);
const fSpire = new THREE.Mesh(new THREE.OctahedronGeometry(2), neonPinkMat); fSpire.position.y = 9.5; fountainGroup.add(fSpire);
const fSpireBase = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 2, 1, 8), goldMat); fSpireBase.position.y = 7.8; fountainGroup.add(fSpireBase);
scene.add(fountainGroup);
const fountainLight = new THREE.PointLight(0xff00aa, 5, 40); fountainLight.position.set(0, 5, entRoomZ); scene.add(fountainLight);

for (let i = -1; i <= 1; i+=2) {
    const sconce = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4, 8), neonPinkMat);
    sconce.position.set(i * 10, 8, ROOM_LENGTH / 2 + ROOM_EXTENSION - 1); scene.add(sconce);
}

const farRoomZ = -ROOM_LENGTH / 2 - ROOM_EXTENSION / 2;
const farFloor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_EXTENSION), new THREE.MeshLambertMaterial({ map: floorTex }));
farFloor.rotation.x = -Math.PI / 2; farFloor.position.set(0, 0, farRoomZ); scene.add(farFloor);
const farCeil = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_WIDTH, ROOM_EXTENSION), new THREE.MeshLambertMaterial({ map: ceilTex }));
farCeil.rotation.x = Math.PI / 2; farCeil.position.set(0, ROOM_HEIGHT, farRoomZ); scene.add(farCeil);

const chandelierGroup = new THREE.Group();
chandelierGroup.position.set(0, ROOM_HEIGHT, farRoomZ);
const chChain = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 4, 8), goldMat); chChain.position.y = -2; chandelierGroup.add(chChain);
const chRing1 = new THREE.Mesh(new THREE.TorusGeometry(9, 0.2, 16, 64), neonPinkMat); chRing1.rotation.x = Math.PI / 2; chRing1.position.y = -4; chandelierGroup.add(chRing1);
const chRing2 = new THREE.Mesh(new THREE.TorusGeometry(7, 0.2, 16, 64), neonGreenMat); chRing2.rotation.x = Math.PI / 2; chRing2.position.y = -6; chandelierGroup.add(chRing2);
const chRing3 = new THREE.Mesh(new THREE.TorusGeometry(5, 0.2, 16, 64), neonPinkMat); chRing3.rotation.x = Math.PI / 2; chRing3.position.y = -8; chandelierGroup.add(chRing3);
for(let i=0; i<8; i++) {
    const angle = (i / 8) * Math.PI * 2;
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 10, 4), goldMat);
    arm.position.set(Math.cos(angle)*4.5, -4.5, Math.sin(angle)*4.5);
    arm.rotation.z = Math.PI / 2; arm.rotation.y = -angle; arm.rotation.x = Math.PI / 4; chandelierGroup.add(arm);
    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.6), neonGreenMat); crystal.position.set(Math.cos(angle)*9, -4.8, Math.sin(angle)*9); chandelierGroup.add(crystal);
    const crystal2 = new THREE.Mesh(new THREE.OctahedronGeometry(0.4), neonPinkMat); crystal2.position.set(Math.cos(angle)*7, -6.8, Math.sin(angle)*7); chandelierGroup.add(crystal2);
}
const chCore = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), neonPinkMat); chCore.position.y = -9; chandelierGroup.add(chCore);
scene.add(chandelierGroup);
const chLightPink = new THREE.PointLight(0xff00ff, 6, 60); chLightPink.position.set(0, 10, farRoomZ); scene.add(chLightPink);
const chLightGreen = new THREE.PointLight(0x00ff44, 6, 60); chLightGreen.position.set(0, 4, farRoomZ); scene.add(chLightGreen);
for (let i = -1; i <= 1; i+=2) {
    const sconce = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4, 8), neonGreenMat);
    sconce.position.set(i * 10, 8, -ROOM_LENGTH / 2 - ROOM_EXTENSION + 1); scene.add(sconce);
}

// TUNNEL
const TUNNEL_WIDTH = 6; const TUNNEL_HEIGHT = 12; const TUNNEL_LENGTH = 40;
const tunnelStartZ = -ROOM_LENGTH / 2 - ROOM_EXTENSION;
const tunnelCenterZ = tunnelStartZ - TUNNEL_LENGTH / 2;

const wallPieceW = (ROOM_WIDTH - TUNNEL_WIDTH) / 2;
const backWallLeft = new THREE.Mesh(new THREE.BoxGeometry(wallPieceW, ROOM_HEIGHT, 1), wallMat); backWallLeft.position.set(-(TUNNEL_WIDTH/2 + wallPieceW/2), ROOM_HEIGHT/2, tunnelStartZ); scene.add(backWallLeft);
const backWallRight = new THREE.Mesh(new THREE.BoxGeometry(wallPieceW, ROOM_HEIGHT, 1), wallMat); backWallRight.position.set(TUNNEL_WIDTH/2 + wallPieceW/2, ROOM_HEIGHT/2, tunnelStartZ); scene.add(backWallRight);
const backWallTop = new THREE.Mesh(new THREE.BoxGeometry(TUNNEL_WIDTH, ROOM_HEIGHT - TUNNEL_HEIGHT, 1), wallMat); backWallTop.position.set(0, TUNNEL_HEIGHT + (ROOM_HEIGHT - TUNNEL_HEIGHT)/2, tunnelStartZ); scene.add(backWallTop);

const tFloor = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH), darkTunnelMat); tFloor.rotation.x = -Math.PI / 2; tFloor.position.set(0, 0, tunnelCenterZ); scene.add(tFloor);
const tCeil = new THREE.Mesh(new THREE.PlaneGeometry(TUNNEL_WIDTH, TUNNEL_LENGTH), darkTunnelMat); tCeil.rotation.x = Math.PI / 2; tCeil.position.set(0, TUNNEL_HEIGHT, tunnelCenterZ); scene.add(tCeil);
const tLeft = new THREE.Mesh(new THREE.BoxGeometry(0.5, TUNNEL_HEIGHT, TUNNEL_LENGTH), darkTunnelMat); tLeft.position.set(-TUNNEL_WIDTH/2, TUNNEL_HEIGHT/2, tunnelCenterZ); scene.add(tLeft);
const tRight = new THREE.Mesh(new THREE.BoxGeometry(0.5, TUNNEL_HEIGHT, TUNNEL_LENGTH), darkTunnelMat); tRight.position.set(TUNNEL_WIDTH/2, TUNNEL_HEIGHT/2, tunnelCenterZ); scene.add(tRight);

const tunnelExitLight = new THREE.PointLight(0xff0000, 8, 25); tunnelExitLight.position.set(0, TUNNEL_HEIGHT/2, tunnelStartZ - TUNNEL_LENGTH + 2); scene.add(tunnelExitLight);

// DOORS & CITY
const entDoorLeftGroup = new THREE.Group(); entDoorLeftGroup.position.set(0, 0, ROOM_LENGTH / 2); const entDoorLeft = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 0.5), doorMat); entDoorLeft.position.set(-7, 9, 0); entDoorLeftGroup.add(entDoorLeft); scene.add(entDoorLeftGroup);
const entDoorRightGroup = new THREE.Group(); entDoorRightGroup.position.set(0, 0, ROOM_LENGTH / 2); const entDoorRight = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 0.5), doorMat); entDoorRight.position.set(7, 9, 0); entDoorRightGroup.add(entDoorRight); scene.add(entDoorRightGroup);
const farDoorLeftGroup = new THREE.Group(); farDoorLeftGroup.position.set(0, 0, -ROOM_LENGTH / 2); const farDoorLeft = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 0.5), doorMat); farDoorLeft.position.set(-7, 9, 0); farDoorLeftGroup.add(farDoorLeft); scene.add(farDoorLeftGroup);
const farDoorRightGroup = new THREE.Group(); farDoorRightGroup.position.set(0, 0, -ROOM_LENGTH / 2); const farDoorRight = new THREE.Mesh(new THREE.BoxGeometry(14, 18, 0.5), doorMat); farDoorRight.position.set(7, 9, 0); farDoorRightGroup.add(farDoorRight); scene.add(farDoorRightGroup);

const cityMat = new THREE.MeshBasicMaterial({ map: cityTex, color: 0xffffff, transparent: true });
const cityBackL = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_LENGTH, 30), cityMat); cityBackL.rotation.y = Math.PI / 2; cityBackL.position.set(-ROOM_WIDTH / 2 - 8, 10, 0); scene.add(cityBackL);
const cityBackR = new THREE.Mesh(new THREE.PlaneGeometry(ROOM_LENGTH, 30), cityMat); cityBackR.rotation.y = -Math.PI / 2; cityBackR.position.set(ROOM_WIDTH / 2 + 8, 10, 0); scene.add(cityBackR);

const MODULE_WIDTH = 8; const NUM_MODULES = Math.floor(ROOM_LENGTH / MODULE_WIDTH);
for (let i = 0; i < NUM_MODULES; i++) {
  const zPos = -ROOM_LENGTH / 2 + (i * MODULE_WIDTH) + (MODULE_WIDTH / 2);
  createWallModule(-ROOM_WIDTH / 2, zPos, Math.PI / 2);
  createWallModule(ROOM_WIDTH / 2, zPos, -Math.PI / 2);
}
function createWallModule(x, z, rotation) {
  const group = new THREE.Group(); group.position.set(x, 0, z); group.rotation.y = rotation;
  const lower = new THREE.Mesh(new THREE.BoxGeometry(MODULE_WIDTH, 6, 1), wallMat); lower.position.set(0, 3, -0.5); group.add(lower);
  const glass = new THREE.Mesh(new THREE.PlaneGeometry(5, 10), glassMat); glass.position.set(0, 11, -0.4); group.add(glass);
  const frameTB = new THREE.BoxGeometry(5.4, 0.4, 0.4);
  const top = new THREE.Mesh(frameTB, goldMat); top.position.set(0, 16, -0.3); group.add(top);
  const bot = new THREE.Mesh(frameTB, goldMat); bot.position.set(0, 6, -0.3); group.add(bot);
  const frameS = new THREE.BoxGeometry(0.4, 10, 0.4);
  const left = new THREE.Mesh(frameS, goldMat); left.position.set(-2.5, 11, -0.3); group.add(left);
  const right = new THREE.Mesh(frameS, goldMat); right.position.set(2.5, 11, -0.3); group.add(right);
  const center = new THREE.Mesh(new THREE.BoxGeometry(0.2, 10, 0.4), goldMat); center.position.set(0, 11, -0.3); group.add(center);
  const pillar = new THREE.Mesh(new THREE.BoxGeometry(1.2, 18, 1.2), wallMat); pillar.position.set(-MODULE_WIDTH / 2, 9, 0); group.add(pillar);
  const cap = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.4, 1.6), goldMat); cap.position.set(-MODULE_WIDTH / 2, 18, 0); group.add(cap);
  scene.add(group);
}

// DECOR
const decorMatDark = new THREE.MeshLambertMaterial({ color: 0x0f0f0f });
const decorMatGreen = new THREE.MeshLambertMaterial({ color: 0x1e3b1e });
const decorMatLeaf = new THREE.MeshLambertMaterial({ color: 0x2b5c2b });
const decorMatTerracotta = new THREE.MeshLambertMaterial({ color: 0x8b4513 });
const lampShadeMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
const ceilingLights = []; 
function createPlant() {
  const group = new THREE.Group();
  const pot = new THREE.Mesh(new THREE.CylinderGeometry(1, 0.8, 1.8, 6), decorMatTerracotta); pot.position.y = 0.9; group.add(pot);
  const dirt = new THREE.Mesh(new THREE.CylinderGeometry(0.9, 0.9, 0.2, 6), decorMatDark); dirt.position.y = 1.8; group.add(dirt);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.15, 3, 4), decorMatDark); trunk.position.y = 3; group.add(trunk);
  for(let i=0; i<8; i++) {
    const leaf = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.1, 0.8), decorMatLeaf);
    leaf.position.y = 3.5 + Math.random() * 1.5; leaf.rotation.y = Math.random() * Math.PI;
    leaf.rotation.z = (Math.random() - 0.5) * 0.8; leaf.position.x = (Math.random() - 0.5) * 1.5; leaf.position.z = (Math.random() - 0.5) * 1.5; group.add(leaf);
  }
  return group;
}
function createLamp() {
  const group = new THREE.Group();
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.2, 8), goldMat); base.position.y = 0.1; group.add(base);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 6, 4), goldMat); pole.position.y = 3; group.add(pole);
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1, 2.5, 8), lampShadeMat); shade.position.y = 6.5; group.add(shade); ceilingLights.push(shade);
  return group;
}
function createVase() {
  const group = new THREE.Group();
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.6, 0.4, 3, 6), decorMatGreen); body.position.y = 1.5; group.add(body);
  const ring = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 0.2, 6), goldMat); ring.position.y = 0.5; group.add(ring);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.3, 1, 6), decorMatGreen); neck.position.y = 3.5; group.add(neck);
  return group;
}

const Z_START = (ROOM_LENGTH / 2) - 20; const Z_SPACING = 7.0;
for (let i = 0; i < ART_COUNT; i++) {
  const isLeft = i % 2 === 0; const rowIndex = Math.floor(i / 2);
  const decorZ = Z_START - (rowIndex * Z_SPACING) - (Z_SPACING / 2);
  const x = isLeft ? -ROOM_WIDTH / 2 + 2.0 : ROOM_WIDTH / 2 - 2.0;
  if (i % 3 === 0) { const lamp = createLamp(); lamp.position.set(x, 0, decorZ); scene.add(lamp); }
  else if (i % 3 === 1) { const plant = createPlant(); plant.position.set(x, 0, decorZ); scene.add(plant); }
  else { const vase = createVase(); vase.position.set(x, 0, decorZ); scene.add(vase); }
}

// LIGHTING
const ambient = new THREE.AmbientLight(0x22110a, 1.5); scene.add(ambient);
const windowLight = new THREE.DirectionalLight(0xffddaa, 1.5); windowLight.position.set(10, 20, 0); scene.add(windowLight);
const lightMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
const ceilingFixtures = [];
for (let z = -ROOM_LENGTH / 2 + 15; z < ROOM_LENGTH / 2; z += 20) {
  const fixture = new THREE.Mesh(new THREE.BoxGeometry(6, 0.4, 2), lightMat); fixture.position.set(0, ROOM_HEIGHT - 0.2, z);
  scene.add(fixture); ceilingFixtures.push(fixture);
}

// ARTWORK
const easelMat = new THREE.MeshLambertMaterial({ color: 0x050505 });
const unitPaintingGeo = new THREE.PlaneGeometry(1, 1);
const MAX_PAINT_W = 4.0; const MAX_PAINT_H = 5.0;
const paintings = [];
const imgLoader = new THREE.ImageLoader(); imgLoader.setCrossOrigin('anonymous'); let activeLoads = 0;

function imageToTexture(img) {
  const scale = Math.min(1, 512 / Math.max(img.width, img.height));
  const w = Math.max(1, Math.round(img.width * scale)); const h = Math.max(1, Math.round(img.height * scale));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(img, 0, 0, w, h);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = renderer.capabilities.getMaxAnisotropy(); return tex;
}
function fitPainting(mesh, imgW, imgH) {
  const aspect = imgW / imgH; const boxAspect = MAX_PAINT_W / MAX_PAINT_H; let w, h;
  if (aspect > boxAspect) { w = MAX_PAINT_W; h = MAX_PAINT_W / aspect; } else { h = MAX_PAINT_H; w = MAX_PAINT_H * aspect; }
  mesh.scale.set(w, h, 1); mesh.position.y = 2.0 + h / 2;
}
function createEasel() {
  const group = new THREE.Group();
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat); pole.position.y = 3.5; group.add(pole);
  const backLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat); backLeg.position.set(0, 3.5, -1.0); backLeg.rotation.x = 0.3; group.add(backLeg);
  const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat); leftLeg.position.set(-1.0, 3.5, 0.5); leftLeg.rotation.z = 0.25; leftLeg.rotation.x = -0.1; group.add(leftLeg);
  const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 7, 4), easelMat); rightLeg.position.set(1.0, 3.5, 0.5); rightLeg.rotation.z = -0.25; rightLeg.rotation.x = -0.1; group.add(rightLeg);
  const shelf = new THREE.Mesh(new THREE.BoxGeometry(4.8, 0.2, 1.4), easelMat); shelf.position.set(0, 2.0, 0.6); group.add(shelf);
  return group;
}

for (let i = 0; i < ART_COUNT; i++) {
  const isLeft = i % 2 === 0; const rowIndex = Math.floor(i / 2);
  const xPos = isLeft ? -ROOM_WIDTH / 2 + 3.5 : ROOM_WIDTH / 2 - 3.5;
  const zPos = Z_START - (rowIndex * Z_SPACING);
  const easel = createEasel(); easel.position.set(xPos, 0, zPos); easel.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2; scene.add(easel);
  const mat = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const mesh = new THREE.Mesh(unitPaintingGeo, mat); mesh.rotation.y = isLeft ? Math.PI / 2 : -Math.PI / 2;
  const forwardOffset = isLeft ? 0.7 : -0.7; mesh.position.set(xPos + forwardOffset, 2.0, zPos);
  scene.add(mesh); paintings.push({ mesh, mat, url: ART_DIR + ART_FILES[i], state: 'pending' });
}

const MAX_CONCURRENT = 3;
function beginLoad(p) {
  p.state = 'loading'; activeLoads++;
  imgLoader.load(p.url, (img) => {
      const tex = imageToTexture(img);
      p.mat.map = tex; p.mat.emissiveMap = tex; p.mat.emissive = new THREE.Color(0xffffff); p.mat.color.setRGB(1, 1, 1); p.mat.needsUpdate = true;
      fitPainting(p.mesh, img.width, img.height); p.state = 'ready'; activeLoads--;
  }, undefined, () => { p.state = 'failed'; activeLoads--; });
}
let scanTimer = 0;
function scanForLoads(dt) {
  scanTimer -= dt; if (scanTimer > 0) return; scanTimer = 0.3;
  if (activeLoads >= MAX_CONCURRENT) return;
  const candidates = [];
  for (const p of paintings) {
    if (p.state !== 'pending') continue;
    const d = p.mesh.position.distanceTo(camera.position);
    if (d < 45) candidates.push({ p, d });
  }
  if (!candidates.length) return;
  candidates.sort((a, b) => a.d - b.d);
  for (const c of candidates) { if (activeLoads >= MAX_CONCURRENT) break; beginLoad(c.p); }
}

const overlay = document.getElementById('overlay'); const crosshair = document.getElementById('crosshair');
const controls = new PointerLockControls(camera, renderer.domElement);
let isTransitioning = false;

overlay.addEventListener('click', () => controls.lock());
controls.addEventListener('lock', () => { overlay.classList.add('hidden'); crosshair.classList.add('on'); startMusic(); });
controls.addEventListener('unlock', () => { if (!isTransitioning) { overlay.classList.remove('hidden'); crosshair.classList.remove('on'); } });

const keys = Object.create(null);
addEventListener('keydown', (e) => { keys[e.code] = true; if (e.repeat) return; if (e.code === 'KeyM') toggleMusic(); if (e.code === 'KeyT') timeScale = timeScale === 1 ? 40 : 1; });
addEventListener('keyup', (e) => { keys[e.code] = false; });

const EYE_HEIGHT = 3.0; const WALK_SPEED = 10; const RUN_SPEED = 20;
const velocity = new THREE.Vector3(); const forward = new THREE.Vector3(); const rightVec = new THREE.Vector3(); const wish = new THREE.Vector3(); const UP = new THREE.Vector3(0, 1, 0);

camera.position.set(0, EYE_HEIGHT, (ROOM_LENGTH / 2) - 2);
camera.rotation.y = Math.PI;

function updatePlayer(dt) {
  if (isTransitioning) return;

  const speed = (keys.ShiftLeft || keys.ShiftRight) ? RUN_SPEED : WALK_SPEED;
  camera.getWorldDirection(forward); forward.y = 0;
  if (forward.lengthSq() < 1e-6) forward.set(0, 0, -1);
  forward.normalize(); rightVec.crossVectors(forward, UP).normalize();

  wish.set(0, 0, 0);
  if (keys.KeyW || keys.ArrowUp) wish.add(forward);
  if (keys.KeyS || keys.ArrowDown) wish.sub(forward);
  if (keys.KeyD || keys.ArrowRight) wish.add(rightVec);
  if (keys.KeyA || keys.ArrowLeft) wish.sub(rightVec);
  if (wish.lengthSq() > 0) wish.normalize().multiplyScalar(speed);

  velocity.lerp(wish, 1 - Math.exp(-10 * dt));
  camera.position.addScaledVector(velocity, dt);

  let limitX = 8;
  let limitZMax = (ROOM_LENGTH / 2) + ROOM_EXTENSION - 2;
  let limitZMin = -(ROOM_LENGTH / 2) - ROOM_EXTENSION - TUNNEL_LENGTH + 2; 

  const tunnelThreshold = -(ROOM_LENGTH / 2) - ROOM_EXTENSION + 2;
  if (camera.position.z < tunnelThreshold) { limitX = (TUNNEL_WIDTH / 2) - 1; }
  
  camera.position.x = Math.max(-limitX, Math.min(limitX, camera.position.x));
  camera.position.z = Math.max(limitZMin, Math.min(limitZMax, camera.position.z));
  camera.position.y = EYE_HEIGHT;

  if (camera.position.z < -(ROOM_LENGTH / 2) - ROOM_EXTENSION - TUNNEL_LENGTH + 4) {
      isTransitioning = true;
      controls.unlock(); 
      const overlay = document.getElementById('overlay');
      overlay.style.opacity = '1'; overlay.classList.remove('hidden');
      overlay.querySelector('.intro').innerText = "Entering the warehouse...";
      overlay.querySelector('.hint').innerText = "";
      crosshair.classList.remove('on');
      setTimeout(() => { window.location.href = 'warehouse.html'; }, 1000);
  }
}

let worldTime = 0; let timeScale = 1;
const cDay = new THREE.Color(0xff5c46); const cPurp = new THREE.Color(0x4b1470); const cWarm = new THREE.Color(0xffddaa); const cTmp = new THREE.Color();

function updateTimeAndLighting() {
  const phase = (worldTime / CYCLE_SECONDS) % 1; const nightFactor = 0.5 - 0.5 * Math.cos(phase * Math.PI * 2);
  cTmp.copy(cDay).lerp(cPurp, nightFactor); cityMat.color.copy(cTmp);
  ambient.intensity = THREE.MathUtils.lerp(1.5, 0.3, nightFactor); windowLight.intensity = THREE.MathUtils.lerp(1.5, 0.1, nightFactor);
  ceilingFixtures.forEach(l => { l.material.color.copy(cTmp).lerp(cWarm, 1 - nightFactor * 0.9); });
  lampShadeMat.color.copy(cWarm).multiplyScalar(1 - nightFactor * 0.7); scene.fog.color.copy(cTmp);
  paintings.forEach(p => { if (p.state === 'ready') p.mat.emissiveIntensity = 0.05 + nightFactor * 0.85; });
  entDoorLeftGroup.position.x = -14 * nightFactor; entDoorRightGroup.position.x = 14 * nightFactor;
  farDoorLeftGroup.position.x = -14 * nightFactor; farDoorRightGroup.position.x = 14 * nightFactor;
  fountainLight.intensity = 1.0 + nightFactor * 6.0; fSpire.rotation.y += 0.02; fSpire.rotation.x += 0.01; fSpire.position.y = 9.5 + Math.sin(worldTime * 3) * 0.5; 
  chLightPink.intensity = 1.0 + nightFactor * 8.0; chLightGreen.intensity = 1.0 + nightFactor * 8.0;
  chandelierGroup.rotation.y += 0.005; chCore.scale.setScalar(1 + Math.sin(worldTime * 4) * 0.1); 
}

let musicEl = null;
function startMusic() {
  if (MUSIC_URL) {
    if (musicEl) { musicEl.play().catch(() => {}); return; }
    musicEl = new Audio(MUSIC_URL); musicEl.volume = 0.55; 
    musicEl.addEventListener('loadedmetadata', () => {
      const randomTime = Math.random() * (musicEl.duration - 5); musicEl.currentTime = randomTime;
      const playWhenReady = () => { musicEl.play().catch(() => {}); };
      musicEl.addEventListener('seeked', playWhenReady, { once: true });
      setTimeout(() => { if (musicEl.paused) playWhenReady(); }, 800);
    }, { once: true });
    musicEl.addEventListener('ended', () => { musicEl.currentTime = 0; musicEl.play().catch(() => {}); });
  }
}
function toggleMusic() { if (musicEl) { musicEl.muted = !musicEl.muted; } }

addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  worldTime += dt * timeScale;
  if (controls.isLocked) updatePlayer(dt); else velocity.multiplyScalar(1 - Math.min(1, 8 * dt));
  scanForLoads(dt); updateTimeAndLighting(); renderer.render(scene, camera);
}
animate();
</script>
